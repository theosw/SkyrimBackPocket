[input]
; DirectInput scan codes. B = 48, V = 47. Set the optional view shortcut to 0 to disable it.
toggle_item_scan_code=48
toggle_view_scan_code=0
; SkyUI gamepad key code. 280 = Left Trigger. Set to -1 to disable the controller action.
; LT is free in LoreRim's Keyboard Friendly and Complete Controller item menus.
; Gamepad++ maps LT to Left Equip, so its users should rebind or disable this action.
controller_toggle_item_key_code=280

[display]
show_notifications=true

[menus]
; Hides pocketed enchanted items from the enchanter's Disenchant list.
; Pocketed unenchanted items remain available when applying a new enchantment.
hide_pocketed_from_disenchanting=true
